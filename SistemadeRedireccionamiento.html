
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">

  <title>Keep Style | Moda Masculina</title>
  <meta name="description" content="Keep Style, tienda virtual de ropa masculina. Descubre nuestros estilos, novedades y redes sociales.">

  <style>
    :root {
      --bg: #080808;
      --gold: #e9be68;
      --white: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* CONTENEDOR PRINCIPAL */

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px 14px 30px;
      background:
        radial-gradient(circle at 50% 30%,
          rgba(218, 168, 76, .11),
          transparent 60%),
        #080808;
    }

    .showcase {
      position: relative;
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 24px;
      box-shadow:
        0 24px 70px rgba(0, 0, 0, .6),
        0 0 35px rgba(233, 190, 104, .1);
      isolation: isolate;
    }

    /* IMAGEN ORIGINAL */

    .showcase-image {
      display: block;
      width: 100%;
      height: auto;
      position: relative;
      z-index: 1;
    }

    /* LOGO ACTUALIZADO */

    .brand-logo {
      position: absolute;
      z-index: 3;
      top: 2.5%;
      left: 49%;
      width: 47%;
      height: 20%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(
        135deg,
        #151515 0%,
        #090909 100%
      );
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,.3);
    }

    .brand-logo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* ZONAS CLICABLES SOBRE LA IMAGEN */

    .social-hotspot {
      position: absolute;
      z-index: 5;
      left: 42%;
      width: 50.5%;
      height: 7.3%;
      border-radius: 50px;
      cursor: pointer;
      display: block;
      outline-offset: 4px;
      transition:
        transform .25s ease,
        box-shadow .25s ease,
        background .25s ease;
    }

    .social-hotspot:hover {
      transform: scale(1.025);
      background: rgba(255,255,255,.07);
      box-shadow: inset 0 0 25px rgba(255,255,255,.12);
    }

    .social-hotspot:focus-visible {
      outline: 3px solid var(--gold);
    }

    .tiktok {
      top: 35.4%;
    }

    .facebook {
      top: 44.1%;
    }

    .instagram {
      top: 52.8%;
    }

    .whatsapp {
      top: 61.5%;
    }

    .social-hotspot.cta {
      top: 82%;
      left: 43%;
      width: 49%;
      height: 7.3%;
    }

    /* BOTONES ADICIONALES PARA CELULARES */

    .mobile-links {
      display: none;
      width: 100%;
      max-width: 540px;
      margin: 20px auto 0;
      padding: 0 3px;
    }

    .mobile-links h2 {
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      color: var(--gold);
      margin-bottom: 18px;
    }

    .mobile-button {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 60px;
      gap: 14px;
      padding: 14px 18px;
      margin-bottom: 12px;
      text-decoration: none;
      color: white;
      background: #161616;
      border: 1px solid #333;
      border-radius: 15px;
      font-weight: 600;
      font-size: 15px;
      transition: .25s ease;
    }

    .mobile-button:hover {
      transform: translateY(-2px);
      background: #222;
    }

    .mobile-button span {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mobile-button .symbol {
      font-size: 12px;
      color: var(--gold);
    }

    .mobile-button.tiktok-mobile {
      border-left: 3px solid #25f4ee;
    }

    .mobile-button.facebook-mobile {
      border-left: 3px solid #1877f2;
    }

    .mobile-button.instagram-mobile {
      border-left: 3px solid #e440a5;
    }

    .mobile-button.whatsapp-mobile {
      border-left: 3px solid #25d366;
    }

    /* FOOTER */

    footer {
      width: 100%;
      background: #050505;
      color: #aaa;
      padding: 25px 16px;
      text-align: center;
      border-top: 1px solid rgba(233,190,104,.2);
    }

    .footer-inner {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .footer-inner img {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      object-fit: contain;
    }

    .footer-inner p {
      font-size: 12px;
      line-height: 1.7;
      letter-spacing: .2px;
    }

    .footer-inner strong {
      color: #f3f3f3;
    }

    .footer-subtitle {
      margin-top: 8px;
      font-size: 11px;
      color: #777;
    }

    /* TABLETS */

    @media (max-width: 900px) {
      main {
        padding: 12px;
      }

      .showcase {
        max-width: 700px;
        border-radius: 18px;
      }

      .brand-logo {
        border-radius: 14px;
      }
    }

    /* CELULARES */

    @media (max-width: 600px) {
      main {
        display: block;
        padding: 0 0 18px;
      }

      .showcase {
        width: 100%;
        max-width: 100%;
        border-radius: 0;
        box-shadow: none;
      }

      .brand-logo {
        border-radius: 9px;
      }

      .social-hotspot {
        min-height: 0;
      }

      .mobile-links {
        display: block;
        padding: 0 18px;
      }

      footer {
        padding: 23px 16px 28px;
      }

      .footer-inner {
        flex-direction: column;
        gap: 8px;
      }

      .footer-inner img {
        width: 58px;
        height: 58px;
      }
    }

    /* ACCESIBILIDAD */

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <main>
    <div class="page-content">

      <section class="showcase"

        <!-- DISEÑO ORIGINAL -->
        <img
          src="keepstyle_design.png"

        <!-- WHATSAPP -->
        <a

        <!-- BOTÓN DORADO -->
        <a

          rel="noopener noreferrer"
          aria-label="Explorar las redes de Keep Style"
          title="Explorar nuestras redes"

      </section>

      <!-- ACCESOS OPTIMIZADOS PARA CELULAR -->

      <nav class="mobile-links"

        <h2>Conecta con nuestro estilo</h2>

        <a
          class="mobile-button tiktok-mobile"
          href="https://www.tiktok.com/@keepstyle.jz?lang=es"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span>TikTok</span>
          <span class="symbol">↗</span>
        </a>

        <a
          class="mobile-button facebook-mobile"
          href="https://www.facebook.com/KeepStyle.Jz"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span>Facebook</span>
          <span class="symbol">↗</span>
        </a>

        <a
          class="mobile-button instagram-mobile"
          href="https://www.instagram.com/keepstyle.jz/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span>Instagram</span>
          <span class="symbol">↗</span>
        </a>

        <a
          class="mobile-button whatsapp-mobile"
          href="https://wa.me/51907564511"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span>WhatsApp</span>
          <span class="symbol">↗</span>
        </a>

      </nav>

    </div>
  </main>

  <!-- COPYRIGHT -->

  <footer>
    <div class="footer-inner">

      <img
        src="logo-keepstyle.png"
        alt="Keep Style"
      >

      <p>
        Copyright © <span id="year"></span>
        <strong>Keep Style For Men.</strong>
        Todos los derechos reservados.
      </p>

    </div>

    <p class="footer-subtitle">
      Moda masculina · Estilo que te representa
    </p>
  </footer>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();
  </script>

</body>
</html>
